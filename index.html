<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IaC Lab — décrire l'infrastructure dans du code</title>
<style>
:root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#2b3b4f;--txt:#e6edf5;--mut:#9fb0c4;--acc:#5cc8ff;--ok:#6fd08c;--new:#ffd166;--bad:#ff7b7b;--unm:#c79bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}header span{color:var(--mut);font-size:12px}
header button{margin-left:auto}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover,button:focus-visible{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:200px 1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"files editor view" "files term view";gap:1px;background:var(--line);min-height:0}
section{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
section>h2{margin:0;padding:6px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--panel2)}
#files{grid-area:files}#editor{grid-area:editor}#term{grid-area:term}#view{grid-area:view}
#tree{list-style:none;margin:0;padding:6px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px}
#tree button{width:100%;text-align:left;border:0;background:none;padding:2px 6px;border-radius:4px}
#tree button[aria-current=true]{background:var(--panel2);color:var(--acc)}
.dir{color:var(--mut);padding:2px 6px}
#edwrap{flex:1;display:flex;min-height:0}
#gutter{white-space:pre;text-align:right;padding:8px 6px;color:#5d7088;font:13px/1.45 ui-monospace,monospace;background:#121b26;overflow:hidden;user-select:none}
#ed{flex:1;background:#0d141c;color:var(--txt);border:0;resize:none;padding:8px;font:13px/1.45 ui-monospace,monospace;tab-size:2;white-space:pre;overflow:auto}
#edbar{display:flex;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#out{flex:1;overflow:auto;padding:8px;font:13px/1.4 ui-monospace,monospace;white-space:pre;background:#0b1118}
.err{color:var(--bad)}.in{color:var(--acc)}.info{color:var(--mut)}
#cmdrow{display:flex;border-top:1px solid var(--line);background:#0b1118}
#prompt{padding:6px 0 6px 8px;font:13px ui-monospace,monospace;color:var(--ok);white-space:pre}
#cmd{flex:1;background:none;border:0;color:var(--txt);font:13px ui-monospace,monospace;padding:6px}
#svgwrap{flex:1;overflow:auto;padding:6px}
svg text{font:12px system-ui,sans-serif;fill:var(--txt)}svg .mut{fill:var(--mut);font-size:11px}
#legend{display:flex;gap:12px;padding:4px 10px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto 280px 280px 360px;grid-template-areas:"files" "editor" "term" "view";overflow:auto}}
</style>
</head>
<body>
<header><h1>IaC Lab</h1><span>Brasserie du Port — simulateur : aucun vrai outil n'est exécuté</span>
<button id="reset" type="button">Réinitialiser</button></header>
<main>
<section id="files" aria-label="Fichiers"><h2>Fichiers</h2><ul id="tree"></ul></section>
<section id="editor" aria-label="Éditeur"><h2 id="edtitle">Éditeur</h2>
<div id="edwrap"><div id="gutter" aria-hidden="true">1</div><textarea id="ed" spellcheck="false" aria-label="Contenu du fichier" disabled></textarea></div>
<div id="edbar"><button id="save" type="button" disabled>Enregistrer (Ctrl+S)</button><span id="edmsg" role="status"></span></div></section>
<section id="term" aria-label="Terminal"><h2>Terminal</h2><div id="out" role="log" aria-live="polite" tabindex="0"></div>
<div id="cmdrow"><span id="prompt"></span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Ligne de commande"></div></section>
<section id="view" aria-label="Vue code, état, monde"><h2>Code → État → Monde réel</h2><div id="svgwrap"></div>
<div id="legend"><span><i class="sw" style="background:var(--ok)"></i>synchronisé</span><span><i class="sw" style="background:var(--new)"></i>à créer</span><span><i class="sw" style="background:var(--bad)"></i>orphelin (plus dans le code)</span><span><i class="sw" style="background:var(--unm)"></i>hors Terraform</span></div></section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
